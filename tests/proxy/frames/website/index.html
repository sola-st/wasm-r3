<!DOCTYPE html>
<html>

<head>
  <title>Worker test</title>
</head>

<body>
  <iframe src="frame1.html"></iframe>
  <iframe src="frame2.html"></iframe>
  <script>
    (async function () {
      const startTime = performance.now();

      const iframes = Array.from(document.querySelectorAll('iframe'));
      await Promise.all(iframes.map((iframe) => new Promise((resolve) => {
        const done = () => { iframe.removeEventListener('load', done); resolve(); };
        try {
          const d = iframe.contentDocument || iframe.contentWindow?.document;
          if (d && d.readyState === 'complete') return resolve(); // already loaded
        } catch {}
        iframe.addEventListener('load', done, { once: true });
      })));

      const endTime = performance.now();
      const executionTime = endTime - startTime;

      const executionTimeElement = document.createElement('p');
      executionTimeElement.textContent = `Execution time: ${executionTime} milliseconds`;
      document.body.appendChild(executionTimeElement);
    })();
  </script>
</body>

</html>
