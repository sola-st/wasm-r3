<!DOCTYPE html>
<html>

<head>
  <title>Worker test</title>
</head>

<body>
  <iframe src="frame1.html"></iframe>
  <script>
    (async function () {
      const startTime = performance.now();

      // Wait for all iframes (handles "already loaded" and errors)
      const iframes = Array.from(document.querySelectorAll('iframe'));
      await Promise.all(
        iframes.map((iframe) => new Promise((resolve) => {
          const done = () => {
            iframe.removeEventListener('load', done);
            iframe.removeEventListener('error', done);
            resolve();
          };

          // If it's already loaded, resolve immediately
          try {
            const d = iframe.contentDocument || iframe.contentWindow?.document;
            if (d && d.readyState === 'complete') return resolve();
          } catch { /* cross-origin access may throw; fall back to events */ }

          iframe.addEventListener('load', done, { once: true });
          iframe.addEventListener('error', done, { once: true });
        }))
      );

      const endTime = performance.now();
      const executionTime = endTime - startTime;

      const executionTimeElement = document.createElement('p');
      executionTimeElement.textContent = `Execution time: ${executionTime} milliseconds`;
      document.body.appendChild(executionTimeElement);
    })();
  </script>
</body>
</html>
